name: Ramagan V1 checks
on:
  push:
    branches: [feat/v1-central-web-mobile]
    paths:
      - 'v1/**'
      - 'backend/vps/**'
      - '.github/workflows/v1-checks.yml'
  pull_request:
    paths:
      - 'v1/**'
      - 'backend/vps/**'
      - '.github/workflows/v1-checks.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax + isolated tests
        run: |
          cd v1
          node --check src/main.js
          node --check src/backend-api.js
          node --check src/math.js
          node --check public/sw.js
          npm test
      - name: Dependency install for build smoke (release requires committed lockfile)
        run: |
          cd v1
          npm install --ignore-scripts --no-audit --no-fund
      - name: Compile website and mobile assets
        run: |
          cd v1
          npm run build
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated self-hosted API dependencies
        working-directory: backend/vps
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax and SQLite stock transactions
        working-directory: backend/vps
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
