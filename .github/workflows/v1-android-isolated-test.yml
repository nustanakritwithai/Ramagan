name: Ramagan isolated Android TEST APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v1/camera-test.html'
      - 'v1/src/camera-test.js'
      - 'v1/src/camera-test.css'
      - 'v1/capacitor.test.config.json'
      - 'v1/vite.test.config.js'
      - 'v1/tests/camera-test.test.mjs'
      - '.github/workflows/v1-android-isolated-test.yml'

permissions:
  contents: read

jobs:
  isolated-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact TEST artifact provenance
        run: |
          git rev-parse HEAD > BUILD_COMMIT.txt
          printf 'TEST ONLY. Synthetic camera and on-device IndexedDB. No shop API or production transactions.\n' > BUILD_NOTICE.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not installed in $SDK_ROOT"; exit 1; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Run isolated synthetic-mode tests and build web assets
        working-directory: v1
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npx vite build --config vite.test.config.js
          test -s dist-test/camera-test.html
          cp dist-test/camera-test.html dist-test/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist-test/index.html', 'utf8');
          const config = JSON.parse(fs.readFileSync('capacitor.test.config.json', 'utf8'));
          if (!html.includes("connect-src 'none'")) throw new Error('TEST page must block all network connections');
          if (!html.includes('camera-test')) throw new Error('TEST page is not the camera-only entry point');
          if (config.appId !== 'online.ramagan.pos.test' || config.appName !== 'Ramagan POS TEST' || config.webDir !== 'dist-test') {
            throw new Error('Unexpected isolated Capacitor TEST identity or web directory');
          }
          NODE
      - name: Generate separate TEST Android wrapper
        working-directory: v1
        run: |
          cp capacitor.test.config.json capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build TEST debug APK
        working-directory: v1/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify TEST package and label
        env:
          APK_PATH: v1/android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/36.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK_PATH" > "$RUNNER_TEMP/test-badging.txt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH" > "$RUNNER_TEMP/test-signature.txt"
          grep -F "package: name='online.ramagan.pos.test'" "$RUNNER_TEMP/test-badging.txt"
          grep -F "application-label:'Ramagan POS TEST'" "$RUNNER_TEMP/test-badging.txt"
          grep -Fq "connect-src 'none'" v1/dist-test/index.html
          cat > APK_VERIFICATION.txt <<EOF
          commit=$(cat BUILD_COMMIT.txt)
          application_id=online.ramagan.pos.test
          application_label=Ramagan POS TEST
          web_entry=synthetic camera test only
          csp_connect_src=none
          api_client_included_in_entry=no
          production_api_url_configured=no
          certificate_sha256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/test-signature.txt" | head -n 1)
          release_signing_key_used=no (standard debug signing only)
          apk_sha256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          apk_bytes=$(wc -c < "$APK_PATH" | tr -d ' ')
          EOF
          cat APK_VERIFICATION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ramagan-pos-test-isolated-TEST
          path: |
            v1/android/app/build/outputs/apk/debug/app-debug.apk
            BUILD_COMMIT.txt
            BUILD_NOTICE.txt
            APK_VERIFICATION.txt
          if-no-files-found: error
          retention-days: 7
