name: Ramagan V1 Android debug APK
# Android build on explicit manual dispatch OR edits to this workflow only.
# This produces a DEBUG APK; not an approved or signed store release.
on:
  workflow_dispatch:
  push:
    branches: [feat/v1-central-web-mobile]
    paths:
      - '.github/workflows/v1-android-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already contains Android SDK; setup-android@v3 currently
      # fails by trying to install the removed SDK package named "tools".
      - name: Install Android platform packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not installed in $SDK_ROOT"; exit 1; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build shared website
        working-directory: v1
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Generate Android wrapper
        working-directory: v1
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK (TEST ONLY)
        working-directory: v1/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ramagan-v1-vps-android-configurable-TEST
          path: v1/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7